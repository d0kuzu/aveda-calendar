version: '3.8'

services:
  aveda-calendar-front:
    build:
      context: .
      args:
        # The secret is baked into the Vite bundle at build time.
        # Set this variable in the shell before running docker compose,
        # or add it to a .env file next to docker-compose.yml:
        # VITE_CALENDAR_SECRET=your-actual-secret
        VITE_CALENDAR_SECRET: ${VITE_CALENDAR_SECRET}
    container_name: aveda-calendar-front
    ports:
      - "8091:80"
    restart: always
